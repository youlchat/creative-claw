[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-claw"
version = "0.1.0"
description = "Clean-room local-first narrative knowledge base and creative agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["creative-writing", "rag", "knowledge-graph", "narrative", "ohlc", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "Flask>=3.0,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "requests>=2.31,<3",
]

[project.scripts]
creative-claw = "creative_claw.cli:main"

[tool.setuptools.packages.find]
include = ["creative_claw*"]

[tool.setuptools.package-data]
creative_claw = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
