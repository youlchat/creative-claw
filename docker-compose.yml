services:
  creative-claw:
    build:
      context: .
    image: creative-claw:local
    ports:
      - "${PORT:-8766}:${PORT:-8766}"
    environment:
      PORT: "${PORT:-8766}"
      CREATIVE_CLAW_DB: /data/creative-claw.db
      CREATIVE_CLAW_PROJECT_ROOT: /data/projects/demo
      CREATIVE_CLAW_LLM_BASE_URL: "${CREATIVE_CLAW_LLM_BASE_URL:-https://api.minimaxi.com/v1}"
      CREATIVE_CLAW_LLM_MODEL: "${CREATIVE_CLAW_LLM_MODEL:-MiniMax-M3}"
      CREATIVE_CLAW_LLM_API_KEY: "${CREATIVE_CLAW_LLM_API_KEY:-}"
      CREATIVE_CLAW_EMBEDDING_BASE_URL: "${CREATIVE_CLAW_EMBEDDING_BASE_URL:-}"
      CREATIVE_CLAW_EMBEDDING_MODEL: "${CREATIVE_CLAW_EMBEDDING_MODEL:-}"
      CREATIVE_CLAW_EMBEDDING_API_KEY: "${CREATIVE_CLAW_EMBEDDING_API_KEY:-}"
    volumes:
      - creative-claw-data:/data
    restart: unless-stopped

volumes:
  creative-claw-data:
